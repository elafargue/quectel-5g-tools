# Telegraf input for Quectel modem status
#
# Polls the router's JSON endpoint and writes to InfluxDB. Drop into
# /etc/telegraf/telegraf.d/ on the machine running Telegraf -- the boat
# server, not the router.
#
# This is the whole pipeline, not half of it. Everything the modem knows --
# signal, carriers, the operator name, the neighbour list -- arrives through
# this one input, and the dashboard in grafana/ queries only the measurements
# defined below.
#
# 5g-collectd is *not* part of this path. It predates it, from when the plan
# was to feed collectd rather than poll JSON, and it carries a strict subset:
# numbers, no operator name, no neighbours, because collectd has no way to
# express them. Running it alongside this would put a second, slightly
# different copy of the same signal readings into InfluxDB under measurement
# names Telegraf derives from the collectd type -- two sources for one number,
# sampled at different moments, certain to disagree eventually and with
# nothing to say which is right.
#
# Use one or the other. This one, if there is a server to run Telegraf on.
# 5g-collectd if you want the router keeping its own data with no server at
# all, or LuCI's built-in graphs -- see the 5g-collectd section in README.md.
#
# 60s is deliberate. get_status() behind this endpoint is six AT commands
# against a serial port that 5g-led-bars (10s), 5g-watchdog and any
# interactive 5g-monitor also want. Polling it at 30s to get finer graphs
# would spend more of the AT bus than it is worth: signal history on a vessel
# is read in hours, and aiming an antenna is what 5g-monitor is for.
#
# ---------------------------------------------------------------------------
# Why one input per measurement
# ---------------------------------------------------------------------------
#
# Not for tidiness. Several [[inputs.http.json_v2]] blocks inside a *single*
# input do not produce several measurements: json_v2 merges them into one
# metric set, the last measurement_name wins, and every tag from every block
# lands on every metric as a cross product. The result is one measurement
# named after whichever block came last, carrying neighbour PCIs as tags on
# the serving cell. It parses without complaint and is entirely wrong.
#
# Separate inputs are the only way to get separate measurements. The repeated
# requests are cheap: reads share a filesystem cache on the router
# (/var/run/quectel-at-cache, `cache_ttl` in /etc/config/quectel), so the
# first request inside the TTL touches the modem and the rest are answered
# from disk.
#
# `optional = true` on every object matters just as much. A missing path fails
# the whole parse rather than the one block, so without it an NR leg that
# detaches stops LTE data arriving too -- at exactly the moment worth
# recording. Every section here is legitimately absent sometimes: no NR when
# detached, no ca when nothing is aggregated, no neighbours when none are
# reported, and none of them at all when the modem answers with an error.

# -------------------------------------------------------------------------
# quectel_lte
# -------------------------------------------------------------------------
# Only bounded dimensions become tags. A tag is an index entry that lives as
# long as the bucket does, and a two-year bucket means cell_id as a tag is one
# entry for every cell ever visited, for the whole voyage. pci and tac are the
# same argument, more slowly. All of them are still here as *fields* --
# queryable and graphable, just not indexed -- and `enodeb`, added by
# utils.add_cell_identity(), is the numeric form of cell_id, so a handover
# graphs as a step rather than needing a tag to group by.
[[inputs.http]]
  urls = ["http://192.168.8.1/cgi-bin/quectel-status"]
  interval = "60s"
  timeout = "15s"
  data_format = "json_v2"
  # Telegraf tags every http metric with the url it came from. It is the same
  # value on every point here and buys nothing but index width.
  tagexclude = ["url"]

  [[inputs.http.json_v2]]
    measurement_name = "quectel_lte"
    [[inputs.http.json_v2.object]]
      path = "serving.lte"
      optional = true
      tags = ["band", "duplex"]

# -------------------------------------------------------------------------
# quectel_nr5g
# -------------------------------------------------------------------------
# Absent whenever the NR leg is detached, which is what `optional` is for.
[[inputs.http]]
  urls = ["http://192.168.8.1/cgi-bin/quectel-status"]
  interval = "60s"
  timeout = "15s"
  data_format = "json_v2"
  # Telegraf tags every http metric with the url it came from. It is the same
  # value on every point here and buys nothing but index width.
  tagexclude = ["url"]

  [[inputs.http.json_v2]]
    measurement_name = "quectel_nr5g"
    [[inputs.http.json_v2.object]]
      path = "serving.nr5g"
      optional = true
      tags = ["band"]

# -------------------------------------------------------------------------
# quectel_carrier_pcc
# -------------------------------------------------------------------------
# The primary carrier. `role` and `rat` are already keys in the object.
[[inputs.http]]
  urls = ["http://192.168.8.1/cgi-bin/quectel-status"]
  interval = "60s"
  timeout = "15s"
  data_format = "json_v2"
  # Telegraf tags every http metric with the url it came from. It is the same
  # value on every point here and buys nothing but index width.
  tagexclude = ["url"]

  [[inputs.http.json_v2]]
    measurement_name = "quectel_carrier_pcc"
    [[inputs.http.json_v2.object]]
      path = "ca.pcc"
      optional = true
      # arfcn for the same reason as on quectel_carrier_scc below. There is
      # only ever one primary, so it cannot collide here -- but the carriers
      # table groups both measurements by arfcn, and a primary without the tag
      # would come back with that column empty.
      tags = ["role", "rat", "band", "arfcn"]

# -------------------------------------------------------------------------
# quectel_carrier_scc
# -------------------------------------------------------------------------
# An array: json_v2 emits one metric per element.
#
# arfcn is a tag here although it is deliberately *not* one on quectel_lte,
# because several secondaries share one poll and quectel_lte never has more
# than one row. A point is identified by measurement plus tags plus time, so
# two secondaries on the same band -- intra-band non-contiguous aggregation,
# or two n78 carriers -- used to have identical keys, and the second write
# replaced the first. Reproduced on the dev stack before this changed: the
# router sent B3 secondaries at EARFCN 1350 and 1850 every poll, and InfluxDB
# kept exactly one point per poll, always 1850. No error, one carrier short.
#
# The cost is bounded by the channels visited rather than the cells: each
# EARFCN belongs to one band and an operator runs a handful per band, so a
# voyage accumulates hundreds of (role, arfcn) series. cell_id would be every
# cell ever passed -- tens of thousands -- which is the line this file draws.
[[inputs.http]]
  urls = ["http://192.168.8.1/cgi-bin/quectel-status"]
  interval = "60s"
  timeout = "15s"
  data_format = "json_v2"
  # Telegraf tags every http metric with the url it came from. It is the same
  # value on every point here and buys nothing but index width.
  tagexclude = ["url"]

  [[inputs.http.json_v2]]
    measurement_name = "quectel_carrier_scc"
    [[inputs.http.json_v2.object]]
      path = "ca.scc"
      optional = true
      tags = ["role", "rat", "band", "arfcn"]

# -------------------------------------------------------------------------
# quectel_neighbour
# -------------------------------------------------------------------------
# The unbounded ones, and the reason this measurement is routed to a bucket
# that expires in a day rather than in two years. Every (pci, arfcn) pair is a
# series, and on a vessel under way that set turns over continuously.
#
# They are also *required*, unlike the tags elsewhere. Every neighbour in one
# poll shares a timestamp, and a point is identified by measurement plus tags
# plus time -- without tags separating them they would overwrite each other
# and a list of seven neighbours would arrive as one. The churn is the price
# of recording the list at all, which is why the answer is a short bucket
# rather than fewer tags.
[[inputs.http]]
  urls = ["http://192.168.8.1/cgi-bin/quectel-status"]
  interval = "60s"
  timeout = "15s"
  data_format = "json_v2"
  # Telegraf tags every http metric with the url it came from. It is the same
  # value on every point here and buys nothing but index width.
  tagexclude = ["url"]

  [[inputs.http.json_v2]]
    measurement_name = "quectel_neighbour"
    [[inputs.http.json_v2.object]]
      path = "neighbours"
      optional = true
      tags = ["pci", "arfcn", "scope", "rat"]

# -------------------------------------------------------------------------
# quectel_serving
# -------------------------------------------------------------------------
# What the modem is attached to, as opposed to how well. `technology` is
# derived in utils.add_technology() and is one of WCDMA, LTE, NSA or SA.
#
# It is a measurement of its own rather than a field on quectel_lte because
# it has to exist when quectel_lte does not. On a 3G attach the modem reports
# neither an LTE nor an NR serving cell, so both of those measurements are
# absent -- and a dashboard inferring the technology from which of them turned
# up would file a perfectly good 3G link as "no reading", indistinguishable
# from an unreachable router.
#
# No tags at all, deliberately. A state timeline wants *one* row whose colour
# changes over time, not a row per technology, so the technology has to be the
# plotted value -- and a value comes from a field. As a tag it could only ever
# be a series name, and the panel would be reduced to plotting some other
# field beside it. Three string fields, one series, no index growth.
[[inputs.http]]
  urls = ["http://192.168.8.1/cgi-bin/quectel-status"]
  interval = "60s"
  timeout = "15s"
  data_format = "json_v2"
  # Telegraf tags every http metric with the url it came from. It is the same
  # value on every point here and buys nothing but index width.
  tagexclude = ["url"]

  [[inputs.http.json_v2]]
    measurement_name = "quectel_serving"
    [[inputs.http.json_v2.object]]
      path = "serving"
      optional = true
      # Only the scalars at the top of `serving`. Without this the nested lte,
      # nr5g and wcdma objects are flattened in here too, duplicating every
      # signal field under a second measurement name.
      included_keys = ["technology", "state", "mode"]

# -------------------------------------------------------------------------
# quectel_operator
# -------------------------------------------------------------------------
# The carrier's name. InfluxDB has string tags, so here it is simply a tag --
# the thing collectd structurally cannot carry.
#
# operator_short is deliberately left off the tag list. A metric whose every
# key is a tag has no fields, and Telegraf drops a metric with no fields
# without saying so: the measurement simply never appears. Leaving one key as
# a (string) field is what makes the point valid.
[[inputs.http]]
  urls = ["http://192.168.8.1/cgi-bin/quectel-status"]
  interval = "60s"
  timeout = "15s"
  data_format = "json_v2"
  # Telegraf tags every http metric with the url it came from. It is the same
  # value on every point here and buys nothing but index width.
  tagexclude = ["url"]

  [[inputs.http.json_v2]]
    measurement_name = "quectel_operator"
    [[inputs.http.json_v2.object]]
      path = "operator"
      optional = true
      tags = ["operator", "mcc_mnc"]

# ---------------------------------------------------------------------------
# Output routing
# ---------------------------------------------------------------------------
#
# Telegraf outputs are global: every input feeds every output unless the
# output filters. So adding these blocks to an agent that already forwards
# collectd would, without the filters, write your collectd data into
# systemhealth a second time *and* send the modem data wherever collectd
# currently goes. Both outputs below therefore take only quectel_*, and the
# existing output needs the mirror image:
#
#   [[outputs.influxdb_v2]]          # your existing one
#     ...
#     namedrop = ["quectel_*"]       # <-- add this line
#
# Token: set INFLUX_TOKEN in Telegraf's environment rather than inlining it
# here. On systemd that is an EnvironmentFile; the config file is
# world-readable on most installs.

[[outputs.influxdb_v2]]
  urls = ["http://baluga.baluga:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "systemhealth"
  namepass = ["quectel_*"]
  namedrop = ["quectel_neighbour"]

# Neighbours go to their own bucket, because InfluxDB 2.x retention is a
# property of the bucket and not of the measurement -- there is no way to
# expire one measurement early inside a shared bucket. Create it with a short
# duration:
#
#   influx bucket create --name systemhealth_short --retention 24h
#
[[outputs.influxdb_v2]]
  urls = ["http://baluga.baluga:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "systemhealth_short"
  namepass = ["quectel_neighbour"]

# ---------------------------------------------------------------------------
# Reading it back with InfluxQL
# ---------------------------------------------------------------------------
#
# InfluxDB 2.x answers InfluxQL only through a DBRP mapping, which is what
# turns database + retention policy into a bucket. The short bucket needs one
# of its own, as a *database* rather than as a retention policy on
# systemhealth: the "short"."quectel_neighbour" qualification that would have
# avoided that is not honoured by 2.x's v1 layer -- it answers with no series
# and no error at all, and a Grafana InfluxQL datasource carries exactly one
# database with no way to name a policy per panel either way.
#
#   influx bucket list                       # note the two bucket IDs
#   influx v1 dbrp create --db systemhealth --rp autogen \
#       --bucket-id <systemhealth id> --default
#   influx v1 dbrp create --db systemhealth_short --rp autogen \
#       --bucket-id <systemhealth_short id> --default
#
# So there are two Grafana datasources, both Query Language = InfluxQL: one on
# Database = systemhealth for every panel but one, and one on Database =
# systemhealth_short for the neighbour panel. If "Neighbours reported" is the
# only empty panel on the dashboard, it is on the wrong one of the two.
