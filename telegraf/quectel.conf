# Telegraf input for Quectel modem status
#
# Polls the router's JSON endpoint and writes to InfluxDB. Drop into
# /etc/telegraf/telegraf.d/ on the machine running Telegraf -- the boat
# server, not the router.
#
# This is the *snapshot* half of the pipeline: everything the modem knows,
# including the operator name and the neighbour list, at a low rate. The fast
# numeric series come from 5g-collectd over the collectd input you already
# have. The split is about the AT bus, which is the scarce resource here:
# 5g-collectd is two AT commands, this endpoint is six. Poll the cheap one
# often and the expensive one rarely.
#
# Both are cheaper than they look. Reads share a filesystem cache on the
# router (/var/run/quectel-at-cache, `cache_ttl` in /etc/config/quectel), so
# requests arriving inside the TTL are answered without touching the modem.

[[inputs.http]]
  urls = ["http://192.168.8.1/cgi-bin/quectel-status"]
  interval = "60s"
  timeout = "15s"
  data_format = "json_v2"

  # A modem that has stopped answering returns {"error": ...} rather than a
  # body that parses as a cell with no signal. json_v2 finds none of the paths
  # below and emits nothing, which is the gap we want rather than a row of
  # zeroes. See "a failed read is not a measurement" in CLAUDE.md.

  # -- Serving cells ---------------------------------------------------------
  # One measurement per RAT rather than a shared one with a `rat` tag: json_v2
  # cannot attach a constant tag inside an object block, and the two have
  # different fields anyway (LTE carries rssi and separate UL/DL bandwidths).
  [[inputs.http.json_v2]]
    measurement_name = "quectel_lte"
    [[inputs.http.json_v2.object]]
      path = "serving.lte"
      # Identity as tags, measurements as fields. band and pci are numbers in
      # the JSON and become string tags here, which is what you want for
      # grouping and for `GROUP BY band` in a panel.
      tags = ["band", "pci", "duplex", "cell_id", "tac"]

  [[inputs.http.json_v2]]
    measurement_name = "quectel_nr5g"
    [[inputs.http.json_v2.object]]
      path = "serving.nr5g"
      tags = ["band", "pci"]

  # -- Aggregated carriers ---------------------------------------------------
  # `role` and `rat` are already fields in each carrier object, so they can be
  # promoted to tags directly and one measurement covers both.
  [[inputs.http.json_v2]]
    measurement_name = "quectel_carrier"
    [[inputs.http.json_v2.object]]
      path = "ca.pcc"
      tags = ["role", "rat", "band", "pci"]

  [[inputs.http.json_v2]]
    measurement_name = "quectel_carrier"
    [[inputs.http.json_v2.object]]
      # An array: json_v2 emits one metric per element.
      path = "ca.scc"
      tags = ["role", "rat", "band", "pci"]

  # -- Neighbour cells -------------------------------------------------------
  # Deliberately its own measurement, because it needs its own retention.
  #
  # Every (pci, arfcn) pair is a distinct series, and on a boat under way that
  # set turns over continuously -- a new set of neighbours every few miles. In
  # a shared measurement with the rest, that churn would grow the index without
  # bound for data nobody queries beyond the last few hours. Keep it short and
  # let it expire; the live panel reads the endpoint directly anyway.
  [[inputs.http.json_v2]]
    measurement_name = "quectel_neighbour"
    [[inputs.http.json_v2.object]]
      path = "neighbours"
      tags = ["pci", "arfcn", "scope", "rat"]

  # -- Operator --------------------------------------------------------------
  # The carrier's name, which is the thing collectd structurally cannot carry.
  # InfluxDB has string tags, so here it is simply a tag.
  [[inputs.http.json_v2]]
    measurement_name = "quectel_operator"
    [[inputs.http.json_v2.object]]
      path = "operator"
      tags = ["operator", "operator_short", "mcc_mnc"]

  # -- Device ----------------------------------------------------------------
  [[inputs.http.json_v2]]
    measurement_name = "quectel_device"
    [[inputs.http.json_v2.object]]
      path = "device"
      tags = ["manufacturer", "model", "revision"]


# ---------------------------------------------------------------------------
# Routing neighbours to a shorter retention
# ---------------------------------------------------------------------------
#
# InfluxDB 1.x -- two outputs, split by measurement name. Create the policy
# first:
#
#   CREATE RETENTION POLICY "short" ON "boat" DURATION 24h REPLICATION 1
#
# [[outputs.influxdb]]
#   urls = ["http://127.0.0.1:8086"]
#   database = "boat"
#   namedrop = ["quectel_neighbour"]
#
# [[outputs.influxdb]]
#   urls = ["http://127.0.0.1:8086"]
#   database = "boat"
#   retention_policy = "short"
#   namepass = ["quectel_neighbour"]
#
# InfluxDB 2.x -- the same split, against a bucket with a 24h retention:
#
# [[outputs.influxdb_v2]]
#   urls = ["http://127.0.0.1:8086"]
#   bucket = "boat"
#   namedrop = ["quectel_neighbour"]
#
# [[outputs.influxdb_v2]]
#   urls = ["http://127.0.0.1:8086"]
#   bucket = "boat_short"
#   namepass = ["quectel_neighbour"]
